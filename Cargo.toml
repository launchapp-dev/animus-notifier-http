[package]
name = "animus-notifier-http"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "HTTP + Slack webhook notifier plugin for Animus (forwards daemon events to external systems with retry + dead-letter)."
repository = "https://github.com/launchapp-dev/animus-notifier-http"
homepage = "https://github.com/launchapp-dev/animus-cli"
readme = "README.md"
authors = ["Launchapp.dev"]
default-run = "animus-notifier-http"

[lib]
name = "animus_notifier_http"
path = "src/lib.rs"

[[bin]]
name = "animus-notifier-http"
path = "src/main.rs"

[dependencies]
animus-plugin-protocol = { git = "https://github.com/launchapp-dev/animus-protocol", tag = "v0.5.4" }
animus-notifier-protocol = { git = "https://github.com/launchapp-dev/animus-protocol", tag = "v0.5.4" }
animus-plugin-runtime = { git = "https://github.com/launchapp-dev/animus-protocol", tag = "v0.5.4" }

anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
dirs = "6"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls-webpki-roots"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "io-util", "io-std"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "test-util"] }
